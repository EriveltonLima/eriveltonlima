<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Executiva ou Econômica</title>
<style>
@page{size:420mm 297mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#14233a;font-family:Inter,"DejaVu Sans",sans-serif}
.page{width:420mm;height:297mm;padding:10mm 11mm;display:grid;grid-template-rows:auto auto 1fr auto;gap:4mm;page-break-after:always;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.5mm solid #14233a;padding-bottom:2.5mm;gap:10mm}
h1{font-size:25pt;margin:0;line-height:1.05}
h1 span{color:#1f5fae}
.sub{font-size:10pt;color:#4a5b70}
.keys{display:flex;gap:4mm;flex-wrap:wrap}
.key{display:flex;align-items:center;gap:2.5mm;padding:2mm 4mm;border-radius:2mm;font-size:10.5pt;font-weight:700}
.key small{font-weight:500;font-size:8.5pt;opacity:.85}
.body{display:grid;grid-template-columns:1fr 112mm;gap:7mm;min-height:0}
svg.map{width:100%;height:100%;display:block}
.cards{display:grid;gap:2.4mm;align-content:start}
.card{display:grid;grid-template-columns:1fr auto;gap:.6mm 3mm;border-radius:2mm;padding:2.6mm 3.4mm;border-left:2.2mm solid}
.card .n{font-weight:800;font-size:11pt}
.card .b{font-weight:800;font-size:9pt;text-transform:uppercase;letter-spacing:.03em;text-align:right;align-self:center}
.card .v{font-family:"JetBrains Mono",monospace;font-size:9pt;color:#2b3b52}
.card .x{font-family:"JetBrains Mono",monospace;font-size:9pt;font-weight:700;text-align:right}
.cards h2{font-size:12pt;margin:0 0 1mm}
footer{font-size:8.6pt;color:#3a4a5e;border-top:.3mm solid #c9d2dc;padding-top:2mm;display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
footer b{color:#14233a}
table.m{border-collapse:separate;border-spacing:1.2mm;width:100%;table-layout:fixed}
.m th{font-size:8.4pt;text-transform:uppercase;letter-spacing:.03em;line-height:1.15;padding:1mm;vertical-align:bottom}
.m th.rh{text-align:left;width:44mm;vertical-align:middle}
.m td{border-radius:1.6mm;padding:2.4mm 1mm;text-align:center;line-height:1.3}
.m td .t{font-size:8.6pt;font-weight:800}
.m td .v{font-family:"JetBrains Mono",monospace;font-size:7.8pt}
</style></head><body><div id="root"></div>
<script src="D3SRC"></script><script src="TOPOSRC"></script>
<script>
const WORLD=/*WORLD*/null, COUNTRIES=/*COUNTRIES*/[];
const REG=[{k:'SA',n:'América Central & Sul',ex:'Brasil, Argentina, Panamá…'},{k:'EU',n:'Europa & Norte da África',ex:'Portugal, Grécia, Turquia, Egito…'},{k:'NA',n:'América do Norte',ex:'EUA, Canadá, México, Caribe'},{k:'ME',n:'Oriente Médio',ex:'Emirados, Catar, Arábia Saudita…'},{k:'AF',n:'África Central & Sul',ex:'África do Sul, Quênia, Etiópia…'},{k:'NC',n:'Oriente Próximo & Ásia Central',ex:'Índia, Sri Lanka, Maldivas…'},{k:'FE',n:'Extremo Oriente',ex:'Japão, China, Tailândia…'},{k:'OC',n:'Oceania',ex:'Austrália, Nova Zelândia…'}];
const RN=Object.fromEntries(REG.map(r=>[r.k,r]));
const RAW={EU:{EU:[30,50],ME:[40,60],AF:[80,110],NC:[70,110],FE:[90,130],OC:[100,150],NA:[70,110],SA:[80,110]},ME:{ME:[25,42],AF:[40,60],NC:[40,60],FE:[60,90],OC:[80,110],NA:[80,110],SA:[80,110]},AF:{AF:[25,42],NC:[60,90],FE:[80,110],OC:[80,110],NA:[80,110],SA:[60,90]},NC:{NC:[25,42],FE:[60,90],OC:[80,110],NA:[100,150],SA:[100,150]},FE:{FE:[35,65],OC:[80,110],NA:[100,150],SA:[100,150]},OC:{OC:[25,42],NA:[100,150],SA:[100,150]},NA:{NA:[25,42],SA:[60,90]},SA:{SA:[25,42]}};
const rt=(a,b)=>(RAW[a]&&RAW[a][b])||RAW[b][a];
const N=x=>(x*500).toLocaleString('pt-BR');
const V=[{max:1.40,t:'Vá de Executiva',s:'paga até 40% a mais',c:'#2f9e6e',fg:'#fff',soft:'#d6f0e3'},
         {max:1.60,t:'Executiva compensa',s:'paga 41% a 60% a mais',c:'#9fdcbc',fg:'#0f3d28',soft:'#e9f7ef'},
         {max:1.75,t:'Depende do voo',s:'paga 61% a 75% a mais',c:'#f3d77e',fg:'#4a3a00',soft:'#fbf3d8'},
         {max:9,t:'Fique na Econômica',s:'paga mais de 75% a mais',c:'#ef9483',fg:'#4d1208',soft:'#fbe3de'}];
const ver=r=>V.find(v=>r<=v.max+1e-9);
const pct=r=>Math.round((r-1)*100)+'%';
const keysHTML=V.map(v=>`<div class="key" style="background:${v.c};color:${v.fg}">${v.t} <small>· ${v.s}</small></div>`).join('');
const feats=topojson.feature(WORLD,WORLD.objects.countries).features.filter(f=>!['Antarctica','Fr. S. Antarctic Lands'].includes(f.properties.name));
const CBY={};COUNTRIES.forEach(c=>CBY[c.en]=c);
// [posição da etiqueta, ponto da região] — etiquetas no mar, com linha até a região
const ANCH={EU:[[-22,57],[12,49]],ME:[[52,-14],[45,24]],AF:[[-8,-22],[22,-6]],NC:[[92,6],[78,22]],FE:[[128,46],[112,34]],OC:[[156,-47],[134,-25]],NA:[[-100,46],null],SA:[[-62,-14],null]};
const root=document.getElementById('root');
const pages=[];
for(const base of REG){
  const list=REG.map(r=>{const [y,c]=rt(base.k,r.k);return {r,y,c,ratio:c/y,v:ver(c/y),self:r.k===base.k}}).sort((a,b)=>a.ratio-b.ratio||b.y-a.y);
  const pg=document.createElement('div');pg.className='page';
  pg.innerHTML=`<header><div><h1>Executiva ou Econômica? <span>Saindo de ${base.n}</span></h1><div class="sub">${base.ex} · Aegean Miles+Bonus · valores por trecho só ida (ida e volta = o dobro)</div></div><div class="sub" style="text-align:right">Cada região do mapa está pintada conforme compensa ou não<br>pagar a Executiva em vez da Econômica para chegar lá</div></header>
  <div class="keys">${keysHTML}</div>
  <div class="body"><svg class="map"></svg><div class="cards"><h2>Para onde, da melhor para a pior Executiva</h2>${list.map(o=>`<div class="card" style="background:${o.v.soft};border-color:${o.v.c}"><span class="n">${o.self?'Dentro de '+o.r.n:o.r.n}</span><span class="b" style="color:${o.v.fg==='#fff'?'#1d7a52':o.v.fg}">${o.v.t}</span><span class="v">Eco ${N(o.y)} → Exec ${N(o.c)}</span><span class="x">+${N(o.c-o.y)} (${pct(o.ratio)})</span></div>`).join('')}</div></div>
  <footer><div><b>Como ler:</b> "+15.000 (38%)" quer dizer que a Executiva custa 15.000 milhas a mais que a Econômica no mesmo trecho, ou 38% a mais.</div><div><b>Conexão não muda o preço:</b> conta só a região de onde você sai e a do destino final. POA → PTY → IST é cobrado como América Central &amp; Sul → Europa.</div><div><b>Antes de transferir milhas:</b> assentos de Executiva aparecem menos. Confira a disponibilidade no site da Aegean.</div></footer>`;
  root.appendChild(pg);pages.push({pg,base,list});
}
// matrix page
const mp=document.createElement('div');mp.className='page';mp.style.gridTemplateRows='auto auto 1fr auto';
let h='<tr><th class="rh">Saindo de ↓ · indo para →</th>'+REG.map(r=>`<th>${r.n}</th>`).join('')+'</tr>';
for(const a of REG){h+=`<tr><th class="rh">${a.n}</th>`+REG.map(b=>{const [y,c]=rt(a.k,b.k);const v=ver(c/y);return `<td style="background:${v.c};color:${v.fg}"><div class="t">${v.t}</div><div class="v">+${N(c-y)} (${pct(c/y)})</div><div class="v">${N(y)} → ${N(c)}</div></td>`}).join('')+'</tr>'}
mp.innerHTML=`<header><div><h1>Executiva ou Econômica? <span>Resumo de todas as regiões</span></h1><div class="sub">Aegean Miles+Bonus · por trecho só ida: Econômica → Executiva, e quanto custa a mais</div></div></header><div class="keys">${keysHTML}</div><table class="m">${h}</table><footer><div><b>Regra geral:</b> voos longos entre continentes quase sempre compensam a Executiva (38% a 60% a mais).</div><div><b>Dentro da mesma região</b> a Executiva custa 68% a mais (86% no Extremo Oriente): só vale se o voo for longo.</div><div><b>Do Brasil</b> o melhor caso é a Europa: 40.000 → 55.000, só 15.000 milhas a mais.</div></footer>`;
root.appendChild(mp);
// draw maps
for(const {pg,base,list} of pages){
  const svg=d3.select(pg.querySelector('svg'));const W=pg.querySelector('svg').clientWidth,H=pg.querySelector('svg').clientHeight;svg.attr('viewBox',`0 0 ${W} ${H}`);
  const proj=d3.geoNaturalEarth1().rotate([-10,0]).fitExtent([[2,2],[W-2,H-2]],{type:'FeatureCollection',features:feats});const path=d3.geoPath(proj);
  const byR=Object.fromEntries(list.map(o=>[o.r.k,o]));
  svg.append('path').attr('d',path(d3.geoGraticule10())).attr('fill','none').attr('stroke','#e9edf2').attr('stroke-width',.4);
  svg.append('g').selectAll('path').data(feats).join('path').attr('d',path).attr('stroke','#fff').attr('stroke-width',.5)
    .attr('fill',f=>{const c=CBY[f.properties.name];const o=c&&byR[c.r];return o?o.v.c:'#e6eaee'});
  // base outline
  const baseF=feats.filter(f=>{const c=CBY[f.properties.name];return c&&c.r===base.k});
  svg.append('path').attr('d',path(topojson.merge(WORLD,WORLD.objects.countries.geometries.filter(g=>{const c=CBY[g.properties.name];return c&&c.r===base.k})))).attr('fill','url(#none)').attr('fill-opacity',0).attr('stroke','#14233a').attr('stroke-width',2.2);
  for(const o of list){const [lp,tp]=ANCH[o.r.k];const p=proj(lp);
    if(tp){const q=proj(tp);svg.append('line').attr('x1',p[0]).attr('y1',p[1]).attr('x2',q[0]).attr('y2',q[1]).attr('stroke','#14233a').attr('stroke-width',.8).attr('stroke-dasharray','2 2');svg.append('circle').attr('cx',q[0]).attr('cy',q[1]).attr('r',2.2).attr('fill','#14233a')}
    const g=svg.append('g').attr('transform',`translate(${p[0]},${p[1]})`);
    const l1=o.self?'VOCÊ ESTÁ AQUI':o.r.n.toUpperCase(), l2=`Eco ${N(o.y)} → Exec ${N(o.c)}`, l3=`+${N(o.c-o.y)} milhas (${pct(o.ratio)})`;
    const w=Math.max(l1.length*6.1,l2.length*5.5,l3.length*5.3)+14;
    g.append('rect').attr('x',-w/2).attr('y',-22).attr('width',w).attr('height',44).attr('rx',5).attr('fill','#fff').attr('fill-opacity',.93).attr('stroke',o.self?'#14233a':o.v.c).attr('stroke-width',o.self?2:1.6);
    g.append('text').attr('y',-8).attr('text-anchor','middle').attr('font-size',10).attr('font-weight',800).attr('fill','#14233a').text(l1);
    g.append('text').attr('y',5).attr('text-anchor','middle').attr('font-size',9).attr('font-family','JetBrains Mono, monospace').attr('fill','#2b3b52').text(l2);
    g.append('text').attr('y',17).attr('text-anchor','middle').attr('font-size',8.6).attr('font-weight',700).attr('fill',o.v.fg==='#fff'?'#1d7a52':o.v.fg).text(l3)}
}
window.READY=true;
</script></body></html>
