<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Erivelton Lima — Educação, Dados e Inteligência Artificial</title>
  <desc id="desc">Banner acadêmico em azul petróleo, marfim e dourado com formas que representam conhecimento, dados e conexões.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102C3A"/>
      <stop offset="0.55" stop-color="#16495B"/>
      <stop offset="1" stop-color="#0A303A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D7B56D" stop-opacity=".22"/>
      <stop offset="1" stop-color="#D7B56D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#E9E2D0" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061A21" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1010" cy="176" r="245" fill="url(#glow)"/>

  <g opacity=".75" fill="none" stroke="#D7B56D">
    <path d="M910 74L1000 117L1089 72L1138 151L1088 246L982 281L893 229L865 140Z" stroke-opacity=".26"/>
    <path d="M910 74L982 281M1000 117L893 229M1089 72L1088 246M865 140L1138 151" stroke-opacity=".16"/>
    <circle cx="910" cy="74" r="7" fill="#D7B56D"/>
    <circle cx="1000" cy="117" r="5" fill="#F2E7C6"/>
    <circle cx="1089" cy="72" r="7" fill="#D7B56D"/>
    <circle cx="1138" cy="151" r="5" fill="#F2E7C6"/>
    <circle cx="1088" cy="246" r="7" fill="#D7B56D"/>
    <circle cx="982" cy="281" r="5" fill="#F2E7C6"/>
    <circle cx="893" cy="229" r="7" fill="#D7B56D"/>
    <circle cx="865" cy="140" r="5" fill="#F2E7C6"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="74" y="66" width="5" height="228" rx="2.5" fill="#D7B56D"/>
    <text x="111" y="133" fill="#F5F0E5" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="-.8">Erivelton Lima</text>
    <text x="114" y="182" fill="#D7B56D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3.5">EDUCAÇÃO  ·  DADOS  ·  INTELIGÊNCIA ARTIFICIAL</text>
    <line x1="114" y1="211" x2="707" y2="211" stroke="#E9E2D0" stroke-opacity=".24"/>
    <text x="114" y="252" fill="#E9E2D0" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing=".35">Tecnologia a serviço do pensamento, da decisão e do humano.</text>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#E9E2D0" stroke-opacity=".16" stroke-width="2"/>
</svg>
