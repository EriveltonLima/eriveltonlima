<svg width="120" height="40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D14836"/>
      <stop offset="100%" stop-color="#B03626"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D14836" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="120" height="40" rx="8" fill="url(#bg)" filter="url(#shadow)"/>
  <rect width="120" height="40" rx="8" fill="transparent" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <g transform="translate(15, 12)">
    <!-- Ícone Gmail -->
    <path d="M7 9.5l-7 5 7 5v-3.5l5-1.5v-3l-5-1.5V9.5zm10 0l7 5-7 5v-3.5l-5-1.5v-3l5-1.5V9.5z" 
          fill="#FFFFFF"/>
    
    <!-- Texto -->
    <text x="28" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">
      Gmail
    </text>
    
    <!-- Badge de status -->
    <circle cx="100" cy="8" r="4" fill="#0AE448"/>
