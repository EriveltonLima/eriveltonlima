<svg width="350" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0AE448"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0AE448" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <style>
    .project-title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #FFFFFF;
    }
    .project-desc {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      fill: #9F9F9F;
    }
    .tech-tag {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      fill: #0AE448;
    }
    .stat {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #FFFFFF;
    }
    .stat-label {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      fill: #9F9F9F;
    }
  </style>
  
  <!-- Card background -->
  <rect width="350" height="180" rx="15" fill="url(#bg)" filter="url(#shadow)" stroke="#333" stroke-width="1"/>
  
  <!-- Header com gradiente -->
  <rect width="350" height="5" rx="15 15 0 0" fill="url(#accent)"/>
  
  <!-- Ícone do projeto -->
  <g transform="translate(20, 25)">
    <!-- Ícone foguete -->
    <path d="M12 2L8 6l4 4-4 4 4 4 4-4 4 4-4-4 4-4-4-4 4-4-4 4z" fill="url(#accent)"/>
    <circle cx="12" cy="12" r="10" fill="none" stroke="url(#accent)" stroke-width="2"/>
  </g>
  
  <!-- Título do projeto -->
  <text x="50" y="35" class="project-title">Antigravity Framework</text>
  
  <!-- Descrição -->
  <text x="20" y="60" class="project-desc">Framework para automação e IA pessoal</text>
  
  <!-- Stats -->
  <g transform="translate(20, 90)">
    <rect width="80" height="40" rx="8" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
    <text x="40" y="25" text-anchor="middle" class="stat">15+</text>
    <text x="40" y="38" text-anchor="middle" class="stat-label">Stars</text>
  </g>
  
  <g transform="translate(110, 90)">
    <rect width="80" height="40" rx="8" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
    <text x="40" y="25" text-anchor="middle" class="stat">5</text>
    <text x="40" y="38" text-anchor="middle" class="stat-label">Forks</text>
  </g>
  
  <g transform="translate(200, 90)">
    <rect width="80" height="40" rx="8" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
    <text x="40" y="25" text-anchor="middle" class="stat">Active</text>
    <text x="40" y="38" text-anchor="middle" class="stat-label">Status</text>
  </g>
  
  <!-- Tech stack -->
  <g transform="translate(20, 145)">
    <text x="0" y="0" class="tech-tag">Python</text>
    <text x="60" y="0" class="tech-tag">Docker</text>
    <text x="130" y="0" class="tech-tag">AI Agents</text>
    <text x="210" y="0" class="tech-tag">Automation</text>
  </g>
  
  <!-- Decoração -->
  <circle cx="320" cy="30" r="4" fill="#0AE448" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="150" r="3" fill="#4ECDC4" opacity="0.5">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>